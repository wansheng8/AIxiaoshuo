<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',Arial,sans-serif" role="img" aria-label="墨枢·部署路线图">
<defs>
<linearGradient id="rg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset="0.5" stop-color="#f0b429"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
</defs>
<rect x="0" y="0" width="1000" height="600" rx="16" fill="#faf8f3"/>
<rect x="0.5" y="0.5" width="999" height="599" rx="16" fill="none" stroke="#e6e0d4"/>
<text x="500" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#1c1e22" letter-spacing="2">墨枢 · 部署路线图</text>
<text x="500" y="70" text-anchor="middle" font-size="13" fill="#4a4d52">公共四步：安装工具 → 下载代码 → 配置模型 → 写出第一章；中间按情况三选一</text>
<rect x="330" y="80" width="340" height="3" rx="1.5" fill="url(#rg)"/>
<rect x="110" y="108" width="360" height="60" rx="10" fill="#1c1e22" stroke="#1c1e22"/>
<text x="290" y="133" text-anchor="middle" font-size="15.5" font-weight="700" fill="#f0b429">① 安装工具</text>
<text x="290" y="153" text-anchor="middle" font-size="11.5" fill="#cfc9bd">Git · Node.js 20 LTS</text>
<rect x="530" y="108" width="360" height="60" rx="10" fill="#1c1e22" stroke="#1c1e22"/>
<text x="710" y="133" text-anchor="middle" font-size="15.5" font-weight="700" fill="#f0b429">② 下载代码</text>
<text x="710" y="153" text-anchor="middle" font-size="11.5" fill="#cfc9bd">clone · 加速前缀 · ZIP</text>
<line x1="470" y1="138" x2="522" y2="138" stroke="#d97706" stroke-width="2"/>
<path d="M522 138 L512 132 L512 144 Z" fill="#d97706"/>
<path d="M710 168 L710 200 M210 200 L790 200 M210 200 L210 226 M500 200 L500 226 M790 200 L790 226" stroke="#c7c0b2" stroke-width="2" fill="none"/>
<text x="500" y="194" text-anchor="middle" font-size="11.5" fill="#4a4d52">按你的情况三选一</text>
<rect x="85" y="228" width="250" height="90" rx="10" fill="#ffffff" stroke="#0e7490"/>
<rect x="85" y="228" width="250" height="5" rx="2.5" fill="#0e7490"/>
<text x="210" y="268" text-anchor="middle" font-size="14" font-weight="700" fill="#0e7490">路线 A · 本机直接部署</text>
<text x="210" y="288" text-anchor="middle" font-size="11.5" fill="#4a4d52">个人电脑 · 最简单</text>
<rect x="375" y="228" width="250" height="90" rx="10" fill="#ffffff" stroke="#d97706"/>
<rect x="375" y="228" width="250" height="5" rx="2.5" fill="#d97706"/>
<text x="500" y="268" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">路线 B · Docker Compose</text>
<text x="500" y="288" text-anchor="middle" font-size="11.5" fill="#4a4d52">服务器 · 推荐</text>
<rect x="665" y="228" width="250" height="90" rx="10" fill="#ffffff" stroke="#2563eb"/>
<rect x="665" y="228" width="250" height="5" rx="2.5" fill="#2563eb"/>
<text x="790" y="268" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">路线 C · systemd</text>
<text x="790" y="288" text-anchor="middle" font-size="11.5" fill="#4a4d52">Linux 长期常驻</text>
<path d="M210 318 L210 350 M790 318 L790 350 M210 350 L790 350 M500 350 L500 376" stroke="#c7c0b2" stroke-width="2" fill="none"/>
<text x="500" y="366" text-anchor="middle" font-size="11.5" fill="#4a4d52">汇合后步骤一致</text>
<rect x="330" y="378" width="340" height="60" rx="10" fill="#eff6ff" stroke="#2563eb"/>
<text x="500" y="403" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">③ 配置模型</text>
<text x="500" y="423" text-anchor="middle" font-size="11.5" fill="#4a4d52">设置页填 Base URL · 模型 · Key</text>
<line x1="500" y1="438" x2="500" y2="466" stroke="#d97706" stroke-width="2"/>
<path d="M500 468 L494 458 L506 458 Z" fill="#d97706"/>
<rect x="330" y="470" width="340" height="64" rx="10" fill="#0e7490" stroke="#0e7490"/>
<text x="500" y="497" text-anchor="middle" font-size="15.5" font-weight="700" fill="#fdf6e3">④ 写出第一章</text>
<text x="500" y="517" text-anchor="middle" font-size="11.5" fill="#d8f0f4">灵感 → 细纲 → 正文</text>
<text x="500" y="576" text-anchor="middle" font-size="11.5" fill="#4a4d52">三条路线只有「怎么跑起来」不同：本机最省事，Docker 好迁移，systemd 适合长期常驻。</text>
