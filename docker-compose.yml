services:
  moshu:
    build:
      context: .
      dockerfile: Dockerfile
    image: moshu:latest
    container_name: moshu
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      PORT: "8787"
      PROMPT_TOKEN_BUDGET: "40000"
      LLM_RETRY_ATTEMPTS: "3"
      LLM_RETRY_BASE_MS: "800"
      LLM_RETRY_MAX_MS: "15000"
      # 可选访问密码，留空表示不启用；可在项目根目录 .env 里设置 ACCESS_PASSWORD
      ACCESS_PASSWORD: "${ACCESS_PASSWORD:-}"
    volumes:
      # 所有工程、文风、设置都在这里，务必持久化
      # Linux 首次部署先执行: mkdir -p data && sudo chown -R 1000:1000 data
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8787/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
